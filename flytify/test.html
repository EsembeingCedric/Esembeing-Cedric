<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTEMB</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="header">
        <div class="container">
            <div class="logo">[Your Logo]</div>
            <div class="nav">
                <a href="index.html">Home</a>
                <a href="test.html">Create Yours</a>
            </div>
        </div>
    </div>

    <div class="builder">
        <div class="container">
            <h1>My Brochure</h1>
            <p class="page-sub">Select a template and fill in your details.</p>

            <!--
            ==========================================
            STEP 1 — Choose a template
            ==========================================
            When you convert this page to PHP, you'll
            read the selected model with $_POST['model'].
            For now it's just a radio group.
            -->

            <div class="form-section">
                <h2>My Template</h2>

                <label class="model-option">
                    <input type="radio" name="model" value="model1" checked>
                    <span class="model-preview box-1">
                        <img src="./Image.png" alt="" height="110px" width="220px">
        
                    </span>
                    <span>[Model 1 — Classic]</span>
                </label>

                <label class="model-option">
                    <input type="radio" name="model" value="model2">
                    <span class="model-preview box-2">[Model 2]</span>
                    <span>[Model 2 — Modern]</span>
                </label>

                <!-- TODO: Add more model options here -->
            </div>

            <!--
            ==========================================
            STEP 2 — Your information
            ==========================================
            TODO: Add more fields (address, website, ...)
            -->

            <div class="form-section">
                <form action="generate.php" method="POST" enctype="multipart/form-data">
                <h2>Personal Informations</h2>

                <div class="field">
                    <label for="name">ESEMBEING CEDRIC FOSSEM</label>
                    <input type="text" id="name" placeholder="[e.g. Jane Doe]">
                </div>

                <div class="field">
                    <label for="company">ESEMBEING SMART TECHNOLOGY FOR ENGINEERING AND MODERN BUSINESS(ESTEMB)</label>
                    <input type="text" id="company" placeholder="[e.g. Acme Inc.]">
                </div>

                <div class="field">
                    <label for="tagline">Innovate. Engineer. Empower</label>
                    <input type="text" id="tagline" placeholder="[e.g. Building the future]">
                </div>

                <div class="row">
                    <div class="field">
                        <label for="email">esembeingcedric925@gmail.com</label>
                        <input type="email" id="email" placeholder="[jane@example.com]">
                    </div>
                    <div class="field">
                        <label for="phone">+237 6 80 10 85 07</label>
                        <input type="tel" id="phone" placeholder="[+1 234 567 890]">
                    </div>
                </div>
            </div>

            <!--
            ==========================================
            STEP 3 — Choose colours
            ==========================================
            The PRIMARY colour preview already works.
            The SECONDARY colour preview is broken —
            your job is to make it work. Check script.js.
            -->

            <div class="form-section">
                <h2>colors</h2>

                <div class="row">
                    <div class="field">
                        <label for="primary-color">bright sky blue</label>
                        <input type="color" id="primary-color" value="#3B82F6">
                        <div class="swatch" id="primary-swatch"></div>
                    </div>
                    <div class="field">
                        <label for="secondary-color">dark navy blue</label>
                        <input type="color" id="secondary-color" value="#1E3A5F">
                        <!-- TODO: The swatch below doesn't update yet.
                             Fix it by adding an event listener in script.js -->
                        <div class="swatch" id="secondary-swatch"></div>
                    </div>
                </div>
            </div>

            <!--
            ==========================================
            STEP 4 — Upload logo
            ==========================================
            TODO: When you add PHP, use enctype="multipart/form-data"
            and handle the file with $_FILES.
            -->

            <div class="form-section">
                <h2>My Logo</h2>
                <div class="field">
                    <label for="logo">
                        <img src="./image1.png" alt="" height="160px" width="190px">
                    </label>
                </div> 
            </div>

            <!--
            ==========================================
            SUBMIT
            ==========================================
            When this becomes PHP, change the button to
            <button type="submit"> and wrap everything
            inside <form action="generate.php" method="POST"
            enctype="multipart/form-data">
            -->

            <div class="form-section action-row">
                <a href="#" class="btn" onclick="alert('This form is not connected yet. After you set up PHP, make it submit to generate.php.'); return false;">
                    Generate My Brochure
                </a>
            </div>

        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>&copy; 2026 | Esembeing Cedric | ESTEMB</p>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
